<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>
    <!-- لود آیکون‌های FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #edebea;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* بخش سمت چپ: تصویر پرتره */
        .left-section {
            flex: 1;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .left-section img {
            max-height: 95vh;
            max-width: 100%;
            object-fit: contain;
            object-position: left bottom;
            display: block;
        }

        /* بخش سمت راست: لوگو، دکمه ورود و شبکه‌های اجتماعی */
        .right-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 25px;
        }

        .logo-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box img {
            max-width: 280px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* استایل دکمه ورود */
        .login-btn {
            background: #e0e0e0;
            color: #555;
            text-decoration: none;
            padding: 10px 48px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 3px 3px 6px #bebebe,
                        -3px -3px 6px #ffffff;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .login-btn:hover {
            box-shadow: inset 2px 2px 4px #bebebe,
                        inset -2px -2px 4px #ffffff;
            color: #222;
        }

        /* ردیف آیکون‌های شبکه‌های اجتماعی */
        .social-icons {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .social-card {
            width: 36px;
            height: 36px;
            background: #e6e6e6;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 2px 2px 4px #c8c8c8,
                        -2px -2px 4px #ffffff;
            transition: all 0.2s ease;
        }

        .social-card:hover {
            color: #000;
            transform: translateY(-2px);
            box-shadow: 3px 3px 6px #b5b5b5,
                        -3px -3px 6px #ffffff;
        }

        /* واکنش‌گرایی برای صفحات موبایل و تبلت */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
                justify-content: center;
                gap: 30px;
                padding: 40px 15px;
            }

            .left-section {
                height: auto;
                justify-content: center;
            }

            .left-section img {
                max-height: 45vh;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تصویر سمت چپ -->
      
        <div class="right-section">
            <!-- تصویر / لوگوی خطاطی -->
            <div class="logo-box">
                <img src="12.jpg" alt="Logo">
            </div>

            <!-- دکمه ورود -->
            <a href="homepage_fa.html" class="login-btn">ورود</a>

            <!-- آیکون‌های سوشال مدیا -->
            <div class="social-icons">
                <!-- وب‌سایت / تحلیل -->
                <a href="https://dr-milad-accounting.ir" target="_blank" class="social-card" title="وبسایت">
                    <i class="fa-solid fa-chart-simple"></i>
                </a>
                <!-- توییتر / X -->
                <a href="https://x.com/dr_milad_accounting" target="_blank" class="social-card" title="X">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <!-- تلگرام -->
                <a href="https://t.me/dr_milad_accounting" target="_blank" class="social-card" title="تلگرام">
                    <i class="fa-brands fa-telegram"></i>
                </a>
                <!-- واتساپ -->
                <a href="https://wa.me/dr_milad_accounting" target="_blank" class="social-card" title="واتساپ">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <!-- اینستاگرام -->
                <a href="https://instagram.com/dr.milad.accounting" target="_blank" class="social-card" title="اینستاگرام">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <!-- لینکدین -->
                <a href="https://linkedin.com/in/dr-milad-accounting" target="_blank" class="social-card" title="لینکدین">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>
            </div>
        </div>

        <div class="left-section">
            <img src="11.jpg" alt="Portrait">
        </div>
    </div>

</body>
</html>
